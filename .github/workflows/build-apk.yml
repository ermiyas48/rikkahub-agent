name: Build APK

on:
  push:
    branches: [feat/telegram-open-and-tools, master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Telegram open-access + tools patches
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path

          h = Path("app/src/main/java/me/rerere/rikkahub/service/TelegramCommandHandlers.kt").read_text()
          old = '''        "/stream" -> { handleStreamCommand(m.chatId, arg); true }\n        else -> false'''
          new = '''        "/stream" -> { handleStreamCommand(m.chatId, arg); true }\n        "/tools" -> { handleToolsCommand(m.chatId, arg); true }\n        "/tool" -> { handleToolCommand(m.chatId, arg); true }\n        else -> false'''
          if old in h:
              h = h.replace(old, new, 1)
              print("handlers when: applied")
          elif "/tools" in h:
              print("handlers when: already present")
          else:
              raise SystemExit("handlers when: pattern not found")

          old = '''        "stream" to "🖼️",\n    )'''
          new = '''        "stream" to "🖼️",\n        "tools" to "🧰",\n        "tool" to "🔧",\n    )'''
          if old in h:
              h = h.replace(old, new, 1)
              print("handlers icons: applied")

          old = '''    val whitelistCount = cfg?.whitelist?.size ?: 0\n    val whitelistLabel = if (whitelistCount == 1) "1 chat" else "$whitelistCount chats"\n'''
          new = '''    val whitelistCount = cfg?.whitelist?.size ?: 0\n    val whitelistLabel = when {\n        cfg?.isOpenAccess == true -> "OPEN (0 = allow all chats)"\n        whitelistCount == 1 -> "1 chat"\n        else -> "$whitelistCount chats"\n    }\n'''
          if old in h:
              h = h.replace(old, new, 1)
              print("handlers status: applied")

          Path("app/src/main/java/me/rerere/rikkahub/service/TelegramCommandHandlers.kt").write_text(h)

          s = Path("app/src/main/java/me/rerere/rikkahub/service/TelegramBotService.kt").read_text()
          old = '''        if (sender !in cfg.whitelist && m.chatId !in cfg.whitelist) {\n            android.util.Log.w(TAG, "handleIncoming: dropping — sender=$sender chat=${m.chatId} not in whitelist=${cfg.whitelist}")'''
          new = '''        // Open mode: whitelist contains 0 (OPEN_ACCESS_CHAT_ID) → accept any sender/chat.\n        if (!cfg.isOpenAccess && sender !in cfg.whitelist && m.chatId !in cfg.whitelist) {\n            android.util.Log.w(TAG, "handleIncoming: dropping — sender=$sender chat=${m.chatId} not in whitelist=${cfg.whitelist}")'''
          if old in s:
              s = s.replace(old, new, 1)
              print("service incoming: applied")
          elif "isOpenAccess" in s:
              print("service incoming: already present")
          else:
              raise SystemExit("service incoming: pattern not found")

          old = '''        if (sender == null || (sender !in cfg.whitelist && cq.chatId !in cfg.whitelist)) {\n            android.util.Log.w(TAG, "handleCallbackQuery: dropping non-whitelisted sender=$sender chat=${cq.chatId}")'''
          new = '''        if (sender == null || (!cfg.isOpenAccess && sender !in cfg.whitelist && cq.chatId !in cfg.whitelist)) {\n            android.util.Log.w(TAG, "handleCallbackQuery: dropping non-whitelisted sender=$sender chat=${cq.chatId}")'''
          if old in s:
              s = s.replace(old, new, 1)
              print("service callback: applied")

          old = '''            "stream" to "Show or toggle auto-streamed screenshots. Usage: /stream [on|off]",\n        )'''
          new = '''            "stream" to "Show or toggle auto-streamed screenshots. Usage: /stream [on|off]",\n            "tools" to "JSON catalog of device tools. Usage: /tools or /tools schema <name>",\n            "tool" to "Run a device tool directly. Usage: /tool <name> <json-args>",\n        )'''
          if old in s:
              s = s.replace(old, new, 1)
              print("service commands: applied")

          Path("app/src/main/java/me/rerere/rikkahub/service/TelegramBotService.kt").write_text(s)
          print("patches complete")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37 platforms;android-36 platforms;android-35 build-tools;35.0.0 cmdline-tools;latest
          log-accepted-android-sdk-licenses: true

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37" "platforms;android-36" "build-tools;35.0.0" "platform-tools" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agent-debug-apk
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
