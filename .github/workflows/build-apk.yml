name: Build APK

on:
  push:
    branches: [feat/telegram-open-and-tools, master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # material3 needs material-color-utilities; llama-cpp needs llama.cpp
          submodules: recursive
          fetch-depth: 1

      - name: Apply Telegram open-access + tools + panel patches
        run: |
          set -e
          sed -i 's/<string name="app_name">RikkaHub Agent<\/string>/<string name="app_name">RH Open Agent<\/string>/' app/src/main/res/values/strings.xml || true
          python3 << 'PY'
          from pathlib import Path

          h = Path("app/src/main/java/me/rerere/rikkahub/service/TelegramCommandHandlers.kt").read_text()
          old = '''        "/stream" -> { handleStreamCommand(m.chatId, arg); true }\n        else -> false'''
          new = '''        "/stream" -> { handleStreamCommand(m.chatId, arg); true }\n        "/tools" -> { handleToolsCommand(m.chatId, arg); true }\n        "/tool" -> { handleToolCommand(m.chatId, arg); true }\n        "/panel" -> { handlePanelCommand(m.chatId, arg); true }\n        else -> false'''
          if old in h:
              h = h.replace(old, new, 1)
              print("handlers when: applied")
          elif "/panel" in h:
              print("handlers when: already present")
          elif "/tools" in h and "/panel" not in h:
              h = h.replace(
                  '''        "/tool" -> { handleToolCommand(m.chatId, arg); true }\n        else -> false''',
                  '''        "/tool" -> { handleToolCommand(m.chatId, arg); true }\n        "/panel" -> { handlePanelCommand(m.chatId, arg); true }\n        else -> false''',
                  1,
              )
              print("handlers when: panel added")
          else:
              raise SystemExit("handlers when: pattern not found")

          old = '''        "stream" to "🖼️",\n    )'''
          new = '''        "stream" to "🖼️",\n        "tools" to "🧰",\n        "tool" to "🔧",\n        "panel" to "📱",\n    )'''
          if old in h:
              h = h.replace(old, new, 1)
              print("handlers icons: applied")

          old = '''    val whitelistCount = cfg?.whitelist?.size ?: 0\n    val whitelistLabel = if (whitelistCount == 1) "1 chat" else "$whitelistCount chats"\n'''
          new = '''    val whitelistCount = cfg?.whitelist?.size ?: 0\n    val whitelistLabel = when {\n        cfg?.isOpenAccess == true -> "OPEN (0 = allow all chats)"\n        whitelistCount == 1 -> "1 chat"\n        else -> "$whitelistCount chats"\n    }\n'''
          if old in h:
              h = h.replace(old, new, 1)
              print("handlers status: applied")

          Path("app/src/main/java/me/rerere/rikkahub/service/TelegramCommandHandlers.kt").write_text(h)

          s = Path("app/src/main/java/me/rerere/rikkahub/service/TelegramBotService.kt").read_text()
          old = '''        if (sender !in cfg.whitelist && m.chatId !in cfg.whitelist) {\n            android.util.Log.w(TAG, "handleIncoming: dropping — sender=$sender chat=${m.chatId} not in whitelist=${cfg.whitelist}")'''
          new = '''        // Open mode: whitelist contains 0 (OPEN_ACCESS_CHAT_ID) → accept any sender/chat.\n        if (!cfg.isOpenAccess && sender !in cfg.whitelist && m.chatId !in cfg.whitelist) {\n            android.util.Log.w(TAG, "handleIncoming: dropping — sender=$sender chat=${m.chatId} not in whitelist=${cfg.whitelist}")'''
          if old in s:
              s = s.replace(old, new, 1)
              print("service incoming: applied")
          elif "isOpenAccess" in s:
              print("service incoming: already present")

          old = '''        if (sender == null || (sender !in cfg.whitelist && cq.chatId !in cfg.whitelist)) {\n            android.util.Log.w(TAG, "handleCallbackQuery: dropping non-whitelisted sender=$sender chat=${cq.chatId}")'''
          new = '''        if (sender == null || (!cfg.isOpenAccess && sender !in cfg.whitelist && cq.chatId !in cfg.whitelist)) {\n            android.util.Log.w(TAG, "handleCallbackQuery: dropping non-whitelisted sender=$sender chat=${cq.chatId}")'''
          if old in s:
              s = s.replace(old, new, 1)
              print("service callback: applied")

          if "PANEL_CB_PREFIX" not in s and 'startsWith("pnl:")' not in s:
              needle = '''            cq.data.startsWith(CLARIFY_CB_PREFIX) -> {
                handleClarifyCallback(cq); return
            }'''
              insert = '''            cq.data.startsWith(CLARIFY_CB_PREFIX) -> {
                handleClarifyCallback(cq); return
            }
            cq.data.startsWith("pnl:") -> {
                handlePanelCallback(cq); return
            }'''
              if needle in s:
                  s = s.replace(needle, insert, 1)
                  print("service panel callback: applied")
              else:
                  print("service panel callback: pattern not found (skip)")

          old = '''            "stream" to "Show or toggle auto-streamed screenshots. Usage: /stream [on|off]",\n        )'''
          new = '''            "stream" to "Show or toggle auto-streamed screenshots. Usage: /stream [on|off]",\n            "tools" to "JSON catalog of device tools. Usage: /tools or /tools schema <name>",\n            "tool" to "Run a device tool directly. Usage: /tool <name> <json-args>",\n            "panel" to "Human control panel with buttons. Usage: /panel",\n        )'''
          if old in s:
              s = s.replace(old, new, 1)
              print("service commands: applied")

          Path("app/src/main/java/me/rerere/rikkahub/service/TelegramBotService.kt").write_text(s)
          print("patches complete")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure Android SDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '%s\n' "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SM=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1 || true)
          if [[ -n "$SM" ]]; then
            yes | "$SM" --licenses >/tmp/sdk-licenses.txt 2>&1 || true
            "$SM" --install "platform-tools" "platforms;android-35" "platforms;android-36" "platforms;android-37" "build-tools;35.0.0" || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -eo pipefail
          which bun java
          test -d material3/material-color-utilities/kotlin && echo "submodule material-color-utilities OK" || echo "WARN missing material-color-utilities"
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
          echo "=== APK outputs ==="
          find app/build/outputs -name '*.apk' -type f -print
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agent-debug-apk
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
